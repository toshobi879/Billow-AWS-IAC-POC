name: VPC • CI/CD (Plan Only)

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main
    paths:
      - modules/vpc/**
      - envs/**/vpc/**

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================================
  # STEP 1: DETECT ENVIRONMENT
  # ==========================================================
  env-detect:
    name: Detect Environment
    runs-on: ubuntu-latest

    outputs:
      env: ${{ steps.setenv.outputs.env }}

    steps:
      - name: Set Environment
        id: setenv
        run: |
          BRANCH="${{ github.base_ref }}"

          if [[ "$BRANCH" == "develop" ]]; then
            echo "env=dev" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            echo "env=uat" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo " Invalid branch"
            exit 1
          fi


  # ==========================================================
  #  STEP 2: VALIDATE
  # ==========================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: env-detect

    environment: ${{ format('{0}-plan', needs.env-detect.outputs.env) }}

    env:
      ENV: ${{ needs.env-detect.outputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Terraform FMT
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: envs/${{ env.ENV }}/vpc
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: envs/${{ env.ENV }}/vpc
        run: terraform validate


  # ==========================================================
  #  STEP 3: SECURITY SCAN
  # ==========================================================
  security-scan:
    name: Security Scan
    needs: [env-detect, terraform-validate]

    uses: ./.github/workflows/security-scan.yml

    with:
      working-directory: envs/${{ needs.env-detect.outputs.env }}/vpc

    secrets: inherit


  # ==========================================================
  #  STEP 4: PLAN
  # ==========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [env-detect, security-scan]

    environment: ${{ format('{0}-plan', needs.env-detect.outputs.env) }}

    env:
      ENV: ${{ needs.env-detect.outputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Terraform Init
        working-directory: envs/${{ env.ENV }}/vpc
        run: terraform init -reconfigure

      - name: Terraform Plan
        working-directory: envs/${{ env.ENV }}/vpc
        run: terraform plan -out=tfplan
